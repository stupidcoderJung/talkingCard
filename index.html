<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드 섞기 앱</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://apis.google.com/js/platform.js" async defer></script>
    <meta name="google-signin-client_id" content="933602161474-j8spusqeuc8cf9o75iqb9nvre3buvnmd.apps.googleusercontent.com">
</head>
<body>
    <div id="mainPage" class="page">
        <div class="container">
            <div class="settings-icon" id="settingsIcon">
                <i class="fas fa-cog"></i>
            </div>
            <div class="card-stack" id="cardStack">
                <div class="card" id="card1"></div>
                <div class="card" id="card2"></div>
                <div class="card" id="card3"></div>
                <div class="card" id="card4"></div>
                <div class="card" id="card5"></div>
                <div class="card active" id="activeCard">
                    <div class="card-inner">
                        <div class="card-face card-front">
                            카드를 클릭하세요
                        </div>
                        <div class="card-face card-back">
                            <!-- 뒷면 내용 (질문) -->
                        </div>
                    </div>
                </div>
            </div>
            <button class="back-button" id="backToTopicInputButton">
                <i class="fas fa-arrow-left"></i>
            </button>
        </div>
    </div>

    <div id="settingsPage" class="page hidden">
        <div class="container">
            <div class="back-icon" id="backIcon">
                <i class="fas fa-arrow-left"></i>
            </div>
            <h1>설정</h1>
            <!-- 여기에 설정 옵션들을 추가할 수 있습니다 -->
        </div>
    </div>

    <div id="topicInputPage" class="page hidden">
        <div class="container">
            <input type="text" id="topicInput" placeholder="사랑, 우정, 가족 등등">
            <button id="startButton">시작</button>
        </div>
    </div>

    <div class="g-signin2" data-onsuccess="onSignIn"></div>
    <button onclick="signOut()">Sign out</button>
    
    <button id="loginButton">Login</button>
    <button id="logoutButton">Logout</button>

    <script src="app.js"></script>
    <script>
        function onSignIn(googleUser) {
            var profile = googleUser.getBasicProfile();
            console.log('ID: ' + profile.getId());
            console.log('Name: ' + profile.getName());
            console.log('Image URL: ' + profile.getImageUrl());
            console.log('Email: ' + profile.getEmail());
            document.getElementById('mainPage').style.display = 'block';
        }

        function signOut() {
            var auth2 = gapi.auth2.getAuthInstance();
            auth2.signOut().then(function () {
                console.log('User signed out.');
                document.getElementById('mainPage').style.display = 'none';
            });
        }

        document.getElementById('backToTopicInputButton').addEventListener('click', goToTopicInput);
    </script>
</body>
</html>
